name: Update playlist.m3u

on:
  push:
    paths:
      - "videos/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate playlist.m3u
        run: |
          echo "#EXTM3U" > playlist.m3u
          for f in videos/*; do
            [ -f "$f" ] || continue
            fname=$(basename "$f")
            title="${fname%.*}"
            url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY}/videos/$fname"
            echo "#EXTINF:-1,$title" >> playlist.m3u
            echo "$url" >> playlist.m3u
            echo "" >> playlist.m3u
          done

      - name: Commit playlist.m3u
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git commit -m "Auto-update playlist.m3u" || echo "No changes"
          git push https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git HEAD:$(git rev-parse --abbrev-ref HEAD)